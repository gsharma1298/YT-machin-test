services:

  node:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: node-app

    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: testdb

    expose:
      - "3000"

    depends_on:
      - mysql

    networks:
      - app-network


  mysql:
    image: mysql:8.0

    container_name: mysql-db

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - app-network


  nginx:
    image: nginx:alpine

    container_name: nginx-proxy

    ports:
      - "80:80"

    volumes:
      - ./app/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - node

    networks:
      - app-network


networks:
  app-network:
    driver: bridge


volumes:
  mysql-data:







